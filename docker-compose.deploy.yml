# Deploy compose — pulls pre-built images from GHCR
# Usage:
#   1. cp .env.deploy.example .env
#   2. cp .env.deploy.api.example apps/api/.env
#   3. Edit both .env files with your settings
#   4. docker login ghcr.io -u <github-user> --password-stdin
#   5. docker compose -f docker-compose.deploy.yml up -d
#
# Minimum requirement: ~1 GB RAM (t3.micro / t4g.micro)

# Set IMAGE_TAG env var to override (default: keis)

services:
  web:
    container_name: web
    image: ghcr.io/kamei-daisuke/plane-frontend:${IMAGE_TAG:-keis}
    restart: always
    mem_limit: 32m
    mem_reservation: 16m
    depends_on:
      - api

  admin:
    container_name: admin
    image: ghcr.io/kamei-daisuke/plane-admin:${IMAGE_TAG:-keis}
    restart: always
    mem_limit: 32m
    mem_reservation: 16m
    depends_on:
      - api
      - web

  api:
    container_name: api
    image: ghcr.io/kamei-daisuke/plane-backend:${IMAGE_TAG:-keis}
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      GUNICORN_WORKERS: 1
    mem_limit: 256m
    mem_reservation: 128m
    depends_on:
      - plane-db
      - plane-redis

  worker:
    container_name: bgworker
    image: ghcr.io/kamei-daisuke/plane-backend:${IMAGE_TAG:-keis}
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    image: ghcr.io/kamei-daisuke/plane-backend:${IMAGE_TAG:-keis}
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      - plane-db
      - plane-redis

  proxy:
    container_name: proxy
    image: ghcr.io/kamei-daisuke/plane-proxy:${IMAGE_TAG:-keis}
    restart: always
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
      ROUTE53_AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      ROUTE53_ACCESS_KEY_ID: ${PROXY_AWS_ACCESS_KEY_ID:-}
      ROUTE53_SECRET_ACCESS_KEY: ${PROXY_AWS_SECRET_ACCESS_KEY:-}
      ROUTE53_HOSTED_ZONE_ID: ${ROUTE53_HOSTED_ZONE_ID:-}
    volumes:
      - caddy_data:/data
    mem_limit: 32m
    mem_reservation: 16m
    depends_on:
      - web
      - api

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: >-
      postgres
        -c max_connections=10
        -c shared_buffers=32MB
        -c work_mem=2MB
        -c maintenance_work_mem=16MB
        -c effective_cache_size=64MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      PGDATA: /var/lib/postgresql/data
    mem_limit: 128m
    mem_reservation: 64m

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    command: valkey-server --maxmemory 16mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    mem_limit: 32m
    mem_reservation: 16m

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 64m
    mem_reservation: 32m

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    mem_limit: 48m
    mem_reservation: 32m

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  caddy_data:

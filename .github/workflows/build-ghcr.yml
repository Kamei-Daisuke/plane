name: Build and Push to GHCR

on:
  push:
    branches:
      - keis
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshot/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/instructions/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - "LICENSE.txt"
      - "COPYRIGHT*.txt"
      - "CODE_OF_CONDUCT.md"
      - "CODEOWNERS"
      - "SECURITY.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      image_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"


  build-web:
    name: Build Web
    needs: [setup]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.setup.outputs.image_owner }}/plane-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin:
    name: Build Admin
    needs: [setup]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile.admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.setup.outputs.image_owner }}/plane-admin:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api:
    name: Build API
    needs: [setup]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.setup.outputs.image_owner }}/plane-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-proxy:
    name: Build Proxy
    needs: [setup]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/proxy
          file: ./apps/proxy/Dockerfile.ce
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.setup.outputs.image_owner }}/plane-proxy:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-space:
    name: Build Space
    needs: [setup]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/space/Dockerfile.space
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.setup.outputs.image_owner }}/plane-space:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-live:
    name: Build Live
    needs: [setup]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:

name: Build and Push to GHCR

on:
  push:
    branches:
      - keis
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshot/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/instructions/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - "LICENSE.txt"
      - "COPYRIGHT*.txt"
      - "CODE_OF_CONDUCT.md"
      - "CODEOWNERS"
      - "SECURITY.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      image_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: [setup]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # web
          - service: web
            image_name: plane-frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - service: web
            image_name: plane-frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          # admin
          - service: admin
            image_name: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - service: admin
            image_name: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          # api
          - service: api
            image_name: plane-backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - service: api
            image_name: plane-backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          # proxy
          - service: proxy
            image_name: plane-proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - service: proxy
            image_name: plane-proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          # space
          - service: space
            image_name: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - service: space
            image_name: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          # live
          - service: live
            image_name: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - service: live
            image_name: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/${{ needs.setup.outputs.image_owner }}/${{ matrix.image_name }}:${{ github.ref_name }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.suffix }}

  manifest:
    name: Manifest ${{ matrix.image_name }}
    needs: [setup, build]
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    strategy:
      matrix:
        image_name: [plane-frontend, plane-admin, plane-backend, plane-proxy, plane-space, plane-live]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        env:
          IMAGE: ghcr.io/${{ needs.setup.outputs.image_owner }}/${{ matrix.image_name }}
          TAG: ${{ github.ref_name }}
        run: |
          docker manifest create $IMAGE:$TAG \
            $IMAGE:$TAG-amd64 \
            $IMAGE:$TAG-arm64
          docker manifest push $IMAGE:$TAG

  deploy:
    name: Deploy to Dokploy
    needs: [manifest]
    runs-on: ubuntu-22.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      - name: Trigger Dokploy redeploy via SSM
        run: |
          SPOT_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names keis-asg \
            --query 'AutoScalingGroups[0].Instances[0].InstanceId' --output text)
          aws ssm send-command \
            --instance-ids "$SPOT_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/usr/local/bin/dokploy-redeploy compose dIrZ5RmInRlDzsbu8kP8h"]'

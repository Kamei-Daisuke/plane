services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    mem_limit: ${WEB_MEM_LIMIT:-40m}
    mem_reservation: ${WEB_MEM_RESERVATION:-20m}
    depends_on:
      - api

  admin:
    container_name: admin
    profiles: ["setup"]
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    mem_limit: ${ADMIN_MEM_LIMIT:-48m}
    mem_reservation: ${ADMIN_MEM_RESERVATION:-24m}
    depends_on:
      - api
      - web

  space:
    container_name: space
    profiles: ["collab"]
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    mem_limit: ${SPACE_MEM_LIMIT:-160m}
    mem_reservation: ${SPACE_MEM_RESERVATION:-96m}
    depends_on:
      - api
      - web

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      GUNICORN_WORKERS: ${API_GUNICORN_WORKERS:-1}
    mem_limit: ${API_MEM_LIMIT:-288m}
    mem_reservation: ${API_MEM_RESERVATION:-176m}
    depends_on:
      - plane-db
      - plane-redis

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    mem_limit: ${WORKER_MEM_LIMIT:-160m}
    mem_reservation: ${WORKER_MEM_RESERVATION:-112m}
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    container_name: beatworker
    profiles: ["collab"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    mem_limit: ${BEAT_WORKER_MEM_LIMIT:-96m}
    mem_reservation: ${BEAT_WORKER_MEM_RESERVATION:-64m}
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    mem_limit: ${MIGRATOR_MEM_LIMIT:-128m}
    mem_reservation: ${MIGRATOR_MEM_RESERVATION:-80m}
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    profiles: ["collab"]
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-local-dev-secret}
      REDIS_URL: redis://${REDIS_HOST:-plane-redis}:${REDIS_PORT:-6379}
    mem_limit: ${LIVE_MEM_LIMIT:-96m}
    mem_reservation: ${LIVE_MEM_RESERVATION:-64m}

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-10}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    mem_limit: ${DB_MEM_LIMIT:-128m}
    mem_reservation: ${DB_MEM_RESERVATION:-80m}

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    mem_limit: ${REDIS_MEM_LIMIT:-48m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-24m}

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: ${MQ_MEM_LIMIT:-96m}
    mem_reservation: ${MQ_MEM_RESERVATION:-64m}

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    mem_limit: ${MINIO_MEM_LIMIT:-48m}
    mem_reservation: ${MINIO_MEM_RESERVATION:-32m}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
    mem_limit: ${PROXY_MEM_LIMIT:-24m}
    mem_reservation: ${PROXY_MEM_RESERVATION:-16m}
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
